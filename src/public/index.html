<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>OctoTasks</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="header">
    <div class="header-inner">
      <div class="brand">
        <svg class="octoicon" viewBox="0 0 16 16" width="32" height="32" aria-hidden="true">
          <path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38
            0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13
            -.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87
            2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95
            0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21
            2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04
            2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15
            0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01
            1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"/>
        </svg>
        <span class="brand-name">OctoTasks</span>
        <span class="brand-tagline">Team task tracker</span>
      </div>
      <nav class="filter-nav" role="navigation" aria-label="Filter tasks">
        <button class="filter-btn active" data-status="all">All</button>
        <button class="filter-btn" data-status="todo">To Do</button>
        <button class="filter-btn" data-status="in-progress">In Progress</button>
        <button class="filter-btn" data-status="done">Done</button>
      </nav>
    </div>
  </header>

  <main class="main">
    <section class="stats" aria-label="Task statistics">
      <div class="stat-card">
        <span class="stat-number" id="stat-total">–</span>
        <span class="stat-label">Total</span>
      </div>
      <div class="stat-card todo">
        <span class="stat-number" id="stat-todo">–</span>
        <span class="stat-label">To Do</span>
      </div>
      <div class="stat-card in-progress">
        <span class="stat-number" id="stat-in-progress">–</span>
        <span class="stat-label">In Progress</span>
      </div>
      <div class="stat-card done">
        <span class="stat-number" id="stat-done">–</span>
        <span class="stat-label">Done</span>
      </div>
    </section>

    <section class="add-task-section">
      <form id="add-task-form" class="add-task-form" aria-label="Add a new task">
        <div class="form-row">
          <input
            type="text"
            id="task-title"
            placeholder="Task title…"
            required
            maxlength="120"
            aria-label="Task title"
          />
          <input
            type="text"
            id="task-description"
            placeholder="Short description (optional)"
            maxlength="255"
            aria-label="Task description"
          />
          <button type="submit" class="btn-primary">Add Task</button>
        </div>
        <p class="form-error hidden" id="form-error" role="alert"></p>
      </form>
    </section>

    <section class="task-list-section" aria-label="Task list">
      <ul id="task-list" class="task-list" aria-live="polite">
        <li class="task-placeholder">Loading tasks…</li>
      </ul>
    </section>
  </main>

  <footer class="footer">
    <p>OctoTasks · Built for the <a href="../docs/index.html">GitHub Developer Training</a> course</p>
  </footer>

  <script src="app.js"></script>
</body>
</html>
